# Выбранные темы для доказательных статей (предложение разработчика владельцу, 2026-11-02).
# Связь с данными — по cluster_id; числа и примеры подставляются из кластеров автоматически.
# audience_expectations — гипотезы разработчика по заголовкам и сводкам поиска, не цитаты и не проверенные наблюдения.
tasks:
  - id: topic-retinoids-start-2026-11
    cluster_id: C01
    title: "Старт ретиноидов: раздражение, «пурджинг» и как вводить в уход"
    question: "Что известно о частоте, длительности и проявлениях ретиноидного раздражения при начале местной терапии (ретинол, ретинальдегид, третиноин, адапален) и какие схемы старта снижают его без потери эффективности?"
    inclusion_criteria:
      - "Клинические исследования и систематические обзоры у людей, местные ретиноиды"
      - "Исходы: раздражение, шелушение, эритема, обострение акне в начале терапии, приверженность"
      - "Клинические рекомендации профессиональных дерматологических обществ"
    exclusion_criteria:
      - "Системные ретиноиды (изотретиноин) — кроме явного сравнения"
      - "Только in vitro или животные модели как основание клинического вывода"
      - "Маркетинговые материалы производителей без опубликованных данных"
    audience_expectations:
      - "шелушение и высыпания в первые недели — «нормальная адаптация», которую нужно перетерпеть"
      - "ретиналь и инкапсулированные формы «мягче» обычного ретинола"
      - "нельзя совмещать ретинол с кислотами и витамином C"
    also_check: ["Cochrane Library", "клинические рекомендации по акне (AAD, EDF и др.)"]
    selection_rationale: "крупнейший кластер выборки; обсуждается на русском и английском на пяти площадках; много вопросов «нормально ли это» — запрос на безопасное объяснение без индивидуальных назначений"
  - id: topic-melasma-lasers-2026-11
    cluster_id: C03
    title: "Мелазма: почему лечение иногда ухудшает пигментацию и что известно о методах"
    question: "Какие методы лечения мелазмы (местные депигментирующие средства, пилинги, лазеры и световые методы) имеют доказательства пользы, и для каких из них описано ухудшение или рецидив пигментации?"
    inclusion_criteria:
      - "Рандомизированные исследования и систематические обзоры лечения мелазмы у людей"
      - "Исходы: шкалы MASI/mMASI, рецидив, поствоспалительная гиперпигментация, нежелательные явления"
    exclusion_criteria:
      - "Серии случаев без контроля как основание вывода об эффективности"
      - "Рекламные материалы клиник"
    audience_expectations:
      - "лазер — способ «убрать» мелазму навсегда"
      - "гидрохинон работает у одних и не работает у других — почему"
      - "одно средство может решить проблему без солнцезащиты"
    also_check: ["ClinicalTrials.gov", "регуляторный статус гидрохинона в стране аудитории"]
    selection_rationale: "наибольшее число площадок в кластере (шесть) и вопросы о вреде («made it worse»): высокий риск неверного понимания и ценность честного разбора"
  - id: topic-biorevitalization-evidence-2026-11
    cluster_id: C09
    title: "Биоревитализация, мезотерапия, PRP и экзосомы: что доказано, а что нет"
    question: "Какие клинические доказательства есть для биоревитализации, мезотерапии, PRP и экзосом в эстетической коррекции кожи лица, каковы описанные нежелательные явления и где данных недостаточно?"
    inclusion_criteria:
      - "Рандомизированные и контролируемые исследования, систематические обзоры у людей"
      - "Исходы: объективные и валидированные оценки кожи, удовлетворённость, нежелательные явления"
    exclusion_criteria:
      - "Исследования, финансируемые производителем, без раскрытия методов — включаются только с пометкой риска смещения"
      - "Доклинические данные экзосом как основание клинической эффективности"
    audience_expectations:
      - "«вся правда о биоревитализации или как нас обманывают» — сомнение, есть ли эффект"
      - "PRP и экзосомы дают заметное омоложение после одной-двух процедур"
      - "результат полностью зависит от врача, а не от метода"
    also_check: ["регистрационный статус препаратов в стране аудитории", "Cochrane Library"]
    selection_rationale: "самая крупная ветка выборки (5 516 ответов на Woman.ru) — сильный сигнал возражений на русском рынке; тема близка к будущему треку досье Proba (лизаты и биотехнологические ингредиенты)"
