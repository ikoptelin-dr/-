# Черновики для X и Threads, первый проход 2026-11-02.
# Автор текста: Claude в сессии разработки (не модель приложения). Это исследовательские черновики:
# ни один не готов к публикации. Числа вида {C01.n} подставляются из кластеров при сборке очереди.
# medical_claims — утверждения, которые нельзя публиковать до проверки источников и медицинской рецензии.
