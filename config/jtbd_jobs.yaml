# Кодовая книга JTBD (набросок). Версия 0.1.0, 2026-11-06.
# Статус: ЧЕРНОВИК разработчика (Claude Code). Формулировки работ — гипотезы; red_flags — черновик для проверки врачом,
# в публикацию без медицинской рецензии не идут.
# Каждая работа находится шаблонами (regex по нижнему регистру) и во фразах Вордстата, и в сообщениях форумов.
# mode — режим, в котором человек приходит:
#   after   — «уже сделали / уже началось, это нормально?» (после процедуры, реакция, побочка)
#   treat   — «лечу/борюсь давно, не помогает»: хроническое состояние
#   decide  — «стоит ли, что выбрать, сколько стоит»: решение о процедуре или средстве
#   routine — «как правильно пользоваться»: домашний уход
#   check   — «правда ли это работает»: проверка обещания, миф
#   navigate— «к кому идти и кому верить»
#   pro_*   — специалист: pro_buy (закупка, линия, аппарат), pro_do (протокол), pro_safe (безопасность),
#             pro_money (экономика), pro_career (вход и границы профессии)
version: "0.1.0"
jobs:
  # ---------------- потребитель: акне ----------------
  - id: acne-why
    segment: consumer
    mode: treat
    cluster: C08
    job: "Когда у меня высыпания, я хочу понять, почему они появляются, чтобы перестать гадать и действовать по причине"
    patterns: ["почему (появляются |вылезают |высыпают )?прыщ", "причин\\w* (прыщ|акне|высыпан)", "от чего (появляются )?прыщ", "что (значат|означают|значит) прыщ", "почему акне"]
    content: "статья-объяснение + пост"
  - id: acne-treat
    segment: consumer
    mode: treat
    cluster: C08
    job: "Когда прыщи не проходят, я хочу знать, чем лечить и сколько ждать, чтобы не тратить годы на перебор средств"
    patterns: ["чем (лечить|мазать|помазать|намазать) прыщ", "как (убрать|избавиться от|вылечить|вывести) прыщ", "что помогает от прыщ", "лечени\\w* (акне|прыщ)", "акне лечени", "от прыщей (крем|мазь|средств)"]
    content: "маршрут лечения: статья + серия"
  - id: acne-blackheads
    segment: consumer
    mode: routine
    cluster: C08
    job: "Когда я вижу чёрные точки и расширенные поры, я хочу понять, что это и что с ними можно делать, чтобы не испортить кожу"
    patterns: ["черн\\w* точк", "комедон", "сальн\\w* нит", "расширенн\\w* пор", "\\bпоры\\b"]
    content: "пост + ролик"
  - id: acne-squeeze
    segment: consumer
    mode: after
    cluster: C08
    job: "Когда хочется выдавить или я уже выдавил(а), я хочу знать, можно ли и что теперь будет, чтобы не оставить шрам"
    patterns: ["выдавлива", "выдавить", "ковыря", "\\bдавить прыщ"]
    content: "пост"
  - id: acne-isotretinoin
    segment: consumer
    mode: treat
    cluster: C08
    job: "Когда мне назначили изотретиноин или я о нём думаю, я хочу знать, что нормально на курсе и чего опасаться, чтобы дойти до конца лечения"
    patterns: ["акнекутан", "роаккутан", "изотретин", "системн\\w* ретиноид", "сотрет\\b", "курс ретиноидов"]
    content: "статья-сопровождение по месяцам"
  - id: acne-topical-drug
    segment: consumer
    mode: decide
    cluster: C08
    job: "Когда мне назвали (или я нашёл) препарат от акне, я хочу понять, что это и как им пользоваться, чтобы не навредить"
    patterns: ["дифферин", "адапален", "эффезел", "базирон", "клиндовит", "зинерит", "скинорен", "азелик", "клензит", "бензоил", "клиндамицин"]
    content: "разбор препарата (только с рецензией)"
  - id: acne-hormonal
    segment: consumer
    mode: treat
    cluster: C08
    job: "Когда акне связано с гормонами или циклом, я хочу понять, к кому идти и какие есть варианты, чтобы лечить причину"
    patterns: ["гормональн\\w* (акне|прыщ|высыпан)", "(акне|прыщ)\\w*.{0,30}(цикл|гормон|противозачат|оральн)", "спиронолакт", "\\byaz\\b|джес\\b|ярин"]
    content: "статья: зона дерматолога и гинеколога"
  - id: acne-marks
    segment: consumer
    mode: treat
    cluster: C08
    job: "Когда после прыщей остались пятна и рубцы, я хочу знать, что из этого уйдёт само, а что лечится, чтобы выбрать честный метод"
    patterns: ["постакне", "рубц", "рубец", "шрам\\w* (от|после) (прыщ|акне)", "пятн\\w* (от|после) прыщ", "следы? (от|после) прыщ", "субцизи", "\\bямк"]
    content: "статья: виды постакне и что реально работает"
  - id: acne-lifestyle
    segment: consumer
    mode: check
    cluster: C08
    job: "Когда мне говорят, что прыщи от еды, грязи или нервов, я хочу знать, что из этого правда, чтобы не винить себя зря"
    patterns: ["(прыщ|акне)\\w*.{0,30}(питани|диет|молок|сахар|стресс|нерв|гигиен)", "(питани|диет|молок|сахар).{0,30}(прыщ|акне)", "грязнул"]
    content: "разбор мифа"
  # ---------------- потребитель: краснота и чувствительность ----------------
  - id: redness-why
    segment: consumer
    mode: treat
    cluster: C07
    job: "Когда лицо краснеет и жжёт, я хочу понять, что это — розацеа, купероз или реакция, чтобы знать, что делать"
    patterns: ["почему краснеет лицо", "лицо краснеет", "покраснени\\w* (лица|на лице|кожи лица)", "красн\\w* нос", "ринофим", "красн\\w* щек"]
    content: "статья-развилка + пост против стигмы"
  - id: rosacea-manage
    segment: consumer
    mode: treat
    cluster: C07
    job: "Когда у меня розацеа годами, я хочу знать триггеры и что реально помогает, чтобы обострения были реже"
    patterns: ["розацеа", "розовые угри", "демодек"]
    content: "статья + серия"
  - id: vessels
    segment: consumer
    mode: decide
    cluster: C07
    job: "Когда на лице видны сосуды, я хочу понять, можно ли их убрать и чем, чтобы не тратить деньги на кремы"
    patterns: ["купероз", "сосуд\\w* на лице", "сосудист\\w* (звездочк|сеточк)", "удалени\\w* сосуд"]
    content: "статья"
  - id: barrier
    segment: consumer
    mode: routine
    cluster: C07
    job: "Когда кожа сухая, стянутая, шелушится или реагирует на всё, я хочу понять, как её восстановить, чтобы перестать ухудшать"
    patterns: ["барьер", "чувствительн\\w* кож", "шелуш", "стягива", "сух\\w* кож\\w* лица", "аллерги\\w* на (косметик|крем)", "дерматит на лице", "периоральн", "себорейн\\w* дерматит"]
    content: "статья + чек-лист"
  - id: lips
    segment: consumer
    mode: treat
    cluster: C07
    job: "Когда с губами что-то не так (трещины, пятнышки, высыпания), я хочу понять, опасно ли это, чтобы знать, нужен ли врач"
    patterns: ["губ\\w* (трескаю|сохнут|шелуш)", "трещин\\w* (на )?губ", "сух\\w* губ", "хейлит", "фордайс", "герпес на губ"]
    content: "пост-развилка"
  # ---------------- потребитель: пигмент, ретиноиды, кислоты, SPF, уход ----------------
  - id: pigment
    segment: consumer
    mode: treat
    cluster: C03
    job: "Когда появились пигментные пятна, я хочу знать, что их уменьшает и что делает хуже, чтобы не испортить кожу"
    patterns: ["пигмент", "мелазм", "хлоазм", "осветл", "отбелива", "темн\\w* кругов?"]
    content: "статья"
  - id: retinoid-start
    segment: consumer
    mode: routine
    cluster: C01
    job: "Когда я начинаю ретинол, я хочу знать, как вводить и что считать нормальной реакцией, чтобы не бросить на старте"
    patterns: ["ретинол", "ретиналь", "третиноин", "бакучиол", "пурджинг", "ретиноидн\\w* дерматит", "^ретиноиды"]
    content: "гайд по старту"
  - id: acids-home
    segment: consumer
    mode: routine
    cluster: C06
    job: "Когда у меня средство с кислотами, я хочу понять, как им пользоваться, чтобы получить пользу без ожога"
    patterns: ["кислот\\w* для лица", "\\baha\\b", "\\bbha\\b", "миндальн", "гликолев", "салицилов", "кислотн\\w* тоник", "пилинг\\w* (в домашних|дома|для лица в домашних)", "энзимн\\w* пилинг", "скатк"]
    content: "пост + ролик"
  - id: spf
    segment: consumer
    mode: routine
    cluster: C10
    job: "Когда я пользуюсь активами или выхожу на солнце, я хочу знать, какой SPF и когда нужен, чтобы не получить пигментацию"
    patterns: ["\\bspf", "\\bспф", "солнцезащит", "защит\\w* от солнца"]
    content: "пост"
  - id: routine-basics
    segment: consumer
    mode: routine
    cluster: C16
    job: "Когда средств слишком много, я хочу простую схему и порядок нанесения, чтобы не тратить лишнее"
    patterns: ["порядок нанесени", "в каком порядке", "как (наносить|пользоваться|использовать) (сыворотк|тонер|крем|ниацинамид)", "базов\\w* уход", "уход за (жирной|сухой|комбинированной|проблемной) кож", "тип кожи", "сыворотк\\w* для лица", "ниацинамид", "бюджетн\\w* уход"]
    content: "гайд-схема"
  # ---------------- потребитель: обещания и мифы ----------------
  - id: collagen-check
    segment: consumer
    mode: check
    cluster: C21
    job: "Когда мне предлагают пить коллаген или другую добавку для кожи, я хочу знать, работает ли это, чтобы не платить за обещание"
    patterns: ["коллаген(?!.{0,30}(сустав|связ|хрящ|волос))", "\\bбад\\w*", "витамин\\w* для кожи", "биотин", "гиалуронов\\w* кислот\\w* (внутрь|в капсулах|пить)"]
    content: "разбор мифа с источниками"
  - id: natural-check
    segment: consumer
    mode: check
    cluster: C21
    job: "Когда мне советуют натуральное, домашнее или модное средство, я хочу знать, безопасно ли оно и работает ли, чтобы не навредить"
    patterns: ["натуральн\\w* косметик", "органическ\\w* косметик", "\\bcbd\\b", "своими руками", "маск\\w* (из|в домашних)", "народн", "корейск\\w* косметик", "пиявк|гирудо", "детокс"]
    content: "разбор мифа"
  - id: label-check
    segment: consumer
    mode: check
    cluster: C21
    job: "Когда я читаю состав и обещания на этикетке, я хочу понять, что из этого правда, чтобы выбирать по делу"
    patterns: ["состав\\w* (крем|косметик|сыворотк)", "как читать состав", "этикетк", "пептид", "стволов\\w* клет", "декспантенол", "пантенол"]
    content: "пост-разбор"
  # ---------------- потребитель: возраст ----------------
  - id: aging-wrinkles
    segment: consumer
    mode: decide
    cluster: C20
    job: "Когда я замечаю морщины, я хочу знать, что действительно уменьшает их, а что — маркетинг, чтобы выбрать уход или процедуру"
    patterns: ["морщин", "антивозраст", "омоложени", "anti.?age", "уход (за лицом )?после (30|35|40|45|50|55)"]
    content: "серия"
  - id: aging-shape
    segment: consumer
    mode: decide
    cluster: C20
    job: "Когда лицо «поплыло» (брыли, носогубки, отёки, мешки), я хочу понять, что с этим можно сделать без операции, чтобы не переплатить"
    patterns: ["брыл", "носогуб", "овал лица", "дрябл", "подтянуть (лицо|кожу)", "мешк\\w* под глаз", "отек\\w* (на )?лиц", "кольца венеры", "второй подбород"]
    content: "серия + ролик"
  - id: home-devices
    segment: consumer
    mode: check
    cluster: C18
    job: "Когда мне предлагают массаж, гимнастику или домашний аппарат для лица, я хочу знать, работает ли это, чтобы не тратить время зря"
    patterns: ["массаж лица", "гимнастик\\w* (для )?лица", "фейсфитнес", "тейпировани", "микроток", "дарсонвал", "массажер для лица"]
    content: "пост-разбор"
  # ---------------- потребитель: процедуры ----------------
  - id: botox-decide
    segment: consumer
    mode: decide
    cluster: C05
    job: "Когда я думаю о ботоксе, я хочу понять, что он делает, кому можно и сколько держится, чтобы решить спокойно"
    patterns: ["ботокс(?!.{0,20}(волос|ресниц))", "ботулин", "диспорт", "ксеомин", "релатокс"]
    content: "статья «что это и кому»"
  - id: botox-after
    segment: consumer
    mode: after
    cluster: C05
    job: "Когда мне уже сделали ботокс, я хочу знать, что можно и что нормально в первые дни, чтобы не испортить результат и не пропустить осложнение"
    patterns: ["(после|алкоголь|нельзя|можно ли).{0,30}(ботокс|ботулин|уколов красоты)", "(ботокс|ботулин|диспорт|релатокс)\\w*.{0,30}(после|нельзя|птоз|домиком|отек|веки|не подействовал)"]
    content: "памятка «после процедуры»"
  - id: lips-decide
    segment: consumer
    mode: decide
    cluster: C04
    job: "Когда я (или близкий) хочу сделать губы или филлер, я хочу заранее знать риски и как выбрать специалиста, чтобы не пожалеть"
    patterns: ["увеличени\\w* губ", "филлер(?!.{0,20}волос)", "губы гиалурон", "контурн\\w* пластик", "накач\\w* губ", "сделать губы", "уколы красоты"]
    content: "статья-информированное согласие"
  - id: lips-after
    segment: consumer
    mode: after
    cluster: C04
    job: "Когда губы или филлер уже сделаны и что-то смущает, я хочу понять, это норма или осложнение, чтобы вовремя обратиться"
    patterns: ["губы после", "(после|отек|синяк|массаж|целоваться|алкоголь).{0,30}(увеличени\\w* губ|филлер)", "(филлер|губ)\\w*.{0,30}(осложнен|комок|комочк|узел|узелк|мигрир|асимметр)", "растворить филлер", "гиалуронидаз", "лонгидаз"]
    content: "памятка «после процедуры» + развилка норма/врач"
  - id: injectables-decide
    segment: consumer
    mode: decide
    cluster: C09
    job: "Когда мне предлагают биоревитализацию, мезотерапию или «бустеры», я хочу понять, что это и есть ли эффект, чтобы не платить вслепую"
    patterns: ["биоревитализ", "мезотерап(?!.{0,20}(волос|голов))", "плазмолифт", "\\bprp\\b", "полинуклеот", "экзосом", "скинбустер", "профайло", "редермализ", "коллост", "сферогел"]
    content: "статья «что это и что доказано»"
  - id: injectables-after
    segment: consumer
    mode: after
    cluster: C09
    job: "Когда после биоревитализации или мезотерапии остались папулы и синяки, я хочу знать, сколько это длится, чтобы не паниковать"
    patterns: ["(после|нельзя|можно ли).{0,30}(биоревит|мезотер|плазмолиф|коллост)", "(биоревит|мезотер|плазмолиф)\\w*.{0,30}(после|папул|синяк|бугорк)"]
    content: "памятка «после»"
  - id: cabinet-what
    segment: consumer
    mode: decide
    cluster: C18
    job: "Когда мне предлагают процедуру в кабинете (чистку, пилинг, маску), я хочу понять, что мне делают и зачем, чтобы не соглашаться вслепую"
    patterns: ["чистк\\w* лица", "альгинат", "гидропилинг", "аквапилинг", "химическ\\w* пилинг", "пилинг у косметолог", "срединн\\w* пилинг", "\\bтса\\b", "джесснер", "карбонов\\w* пилинг", "карбокситерап", "процедур\\w* (у|в кабинете) косметолог"]
    content: "серия «что вам делают в кабинете»"
  - id: hair-removal
    segment: consumer
    mode: decide
    cluster: C14
    job: "Когда я выбираю удаление волос, я хочу знать, сколько сеансов нужно и что реально, чтобы не выбросить деньги"
    patterns: ["лазерн\\w* эпиляц", "фотоэпиляц", "электроэпиляц", "диодн\\w* лазер", "александрит", "шугаринг", "восков\\w* депиляц", "волос\\w* на лице", "гирсут", "вросш\\w* волос"]
    content: "статья"
  - id: lifting-hardware
    segment: consumer
    mode: decide
    cluster: C09
    job: "Когда мне предлагают аппаратный лифтинг или нити, я хочу понять, чего ждать и какой ценой, чтобы решить без давления"
    patterns: ["смас", "\\bsmas", "rf.?лифтинг", "ультразвуков\\w* лифтинг", "нит\\w* (лифтинг|подтяж)", "нитев", "мезонит", "липолитик(?!.{0,20}(живот|тел|похуд))"]
    content: "статья"
  - id: price
    segment: consumer
    mode: decide
    cluster: C17
    job: "Когда я прикидываю процедуру, я хочу понять, сколько она стоит и за что я плачу, чтобы не переплатить"
    patterns: ["\\bцен[аыуе]\\b", "стоимост", "сколько стоит", "недорог", "прайс"]
    content: "не наш формат — показатель денег в теме"
  - id: choose-specialist
    segment: consumer
    mode: navigate
    cluster: C16
    job: "Когда мне нужен косметолог или дерматолог, я хочу понять, кому можно доверять, чтобы не попасть к случайному человеку"
    patterns: ["(косметолог|дерматолог|дерматокосметолог)\\w*.{0,15}отзыв", "отзыв\\w*.{0,15}(косметолог|дерматолог)", "лучш\\w* (косметолог|дерматолог)", "хорош\\w* (косметолог|дерматолог)", "как выбрать (косметолог|дерматолог|клиник)", "косметолог или дерматолог", "дерматолог или косметолог", "что (делает|лечит) (косметолог|дерматолог)", "к какому врачу"]
    content: "пост «вопросы до записи»"
  - id: diy-procedures
    segment: consumer
    mode: check
    cluster: C13
    job: "Когда хочется сделать процедуру самой дома, я хочу знать, что безопасно, а что нет, чтобы не навредить"
    patterns: ["(колоть|уколы|ботокс|гиалурон\\w*|мезороллер|дермапен).{0,30}(сам|в домашних|дома)", "(чистк\\w* лица|пилинг) (в домашних|дома)"]
    content: "пост-предупреждение"
  # ---------------- специалист ----------------
  - id: pro-career
    segment: pro
    mode: pro_career
    cluster: C19
    job: "Когда я вхожу в профессию или осваиваю новое, я хочу понять, чему и где учиться и где граница моей компетенции, чтобы работать законно и безопасно"
