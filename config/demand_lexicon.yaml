# Основной кластер записи выбирается по этому порядку: сначала конкретные средства и процедуры,
# затем состояния кожи. Остальные совпадения учитываются как дополнительные упоминания.
primary_order: [C13, C12, C01, C02, C11, C04, C05, C09, C06, C10, C03, C07, C08]
clusters:
  - id: C01
    name: "Ретиноиды: как начать и что считать нормальной реакцией"
    concepts: [retinoids]
    publication_topics:
      - "Раздражение или «пурджинг»: как различать и когда остановиться"
      - "Ретинол, ретиналь, третиноин: в чём разница для кожи и для рецепта"
    research_question: "Сколько длится и как выглядит ретиноидный дерматит при начале терапии, и какие схемы старта снижают раздражение?"
    pubmed_query_draft: '(retinoids[MeSH] OR retinol OR tretinoin OR retinaldehyde) AND (irritant dermatitis OR tolerability OR "retinoid dermatitis") AND (topical)'
  - id: C02
    name: "Ниацинамид: переносимость и высыпания"
    concepts: [niacinamide]
    publication_topics:
      - "Почему одна сыворотка с ниацинамидом «работает», а другая нет: концентрация, формула, ожидания"
    research_question: "Связан ли местный ниацинамид с раздражением или высыпаниями и от чего это зависит?"
    pubmed_query_draft: 'niacinamide[MeSH] AND (topical OR cosmetic) AND (irritation OR tolerability OR acne)'
