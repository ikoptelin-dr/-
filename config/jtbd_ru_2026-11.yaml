# Блок «что болит у косметологов» по PF-K. Почти всё — 2010–2020 годы: это история, а не текущий спрос.
pain_points_professionals:
  - title: "Нет независимых данных при выборе линии"
    clusters: [C16]
    summary: "Типовой вопрос — кто из коллег уже работает на марке и какой результат. Ответов часто нет или они похожи на рекламу; обучение проводит продавец; встречается опыт, что после обучения эффекта в работе не увидели."
    threads: ["ru_pf_k:2417", "ru_pf_k:7173", "ru_pf_k:3760", "ru_pf_k:8666"]
  - title: "Скрытая реклама под видом отзывов"
    clusters: [C16, C15]
    summary: "Заметная доля сообщений — объявления и восторженные отзывы с ссылками на магазины. Это само по себе сигнал: специалисту трудно найти честный опыт коллег."
    threads: ["ru_pf_k:15632", "ru_pf_k:1551", "ru_pf_k:20763", "ru_pf_k:23269"]
  - title: "Поставки: где купить официально и что делать при перебоях"
    clusters: [C15]
    summary: "Ищут официального дистрибьютора в регионе (Россия и Украина), проверку документов и подлинности, недорогие расходники; страдают от перебоев и снятых с производства позиций."
    threads: ["ru_pf_k:15632", "ru_pf_k:2417", "ru_pf_k:7173", "ru_pf_k:20604", "ru_pf_k:23412"]
  - title: "Экономика процедуры непрозрачна"
    clusters: [C17]
    summary: "Прайсы скрыты, непонятно, на сколько процедур рассчитан набор, оправдана ли цена дорогих масел и китов; вопрос «окупится ли» при вводе услуги в прайс (в том числе свежий вопрос 2024–2025)."
    threads: ["ru_pf_k:2417", "ru_pf_k:8666", "ru_pf_k:20604", "ru_pf_k:1551"]
  - title: "Протоколы и перенос между линиями"
    clusters: [C18]
    summary: "Последовательность чистки, что класть под альгинат, фонофорез по гелю, комедоны «не выходят»; как собрать процедуру из средств разных марок; что ввести в прайс вместо инъекционной методики."
    threads: ["ru_pf_k:6878", "ru_pf_k:1551", "ru_pf_k:20604", "ru_pf_k:8666"]
  - title: "Реакции у клиентов после процедур"
    clusters: [C07]
    summary: "Зуд и шелушение век после альгинатных масок, непереносимость, высыпания после крема — и неуверенность, связано ли это со средством. В данных есть и контрпример (у другого специалиста проблем нет)."
    threads: ["ru_pf_k:1551", "ru_pf_k:20763"]
  - title: "Сложная кожа: акне + возраст + пигментация"
    clusters: [C06, C08, C03]
    summary: "Можно ли кислоты при воспалении, как совмещать работу с акне и лифтингом, что выбрать против пятен. Вопросы задавали в теме бренда — ответы давали представители производителя."
    threads: ["ru_pf_k:23412"]
  - title: "Обучение и границы профессии"
    clusters: [C19]
    summary: "Можно ли учиться аппаратной косметологии без медобразования; новичкам страшно спрашивать; обучение часто привязано к бренду."
    threads: ["ru_pf_k:20763", "ru_pf_k:20604", "ru_pf_k:8666"]
  - title: "Как объяснять клиенту и спорить с мифами"
    clusters: [C21, C16]
    summary: "Клиенты не понимают процедур и боятся слова «антивозрастной»; ходят мифы (иностранная косметика «не под нашу кожу», питьевой коллаген). Специалисту нужен короткий доказательный ответ."
    threads: ["ru_pf_k:26198", "ru_pf_k:26510", "ru_pf_k:20604", "ru_pf_k:1551"]

