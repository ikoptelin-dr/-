# Маски Яндекс Вордстата, волна 1. Версия 0.1.0, 2026-11-05.
# Основа — кластеры C01–C21 (config/demand_lexicon.yaml) и формулировки из отчёта reports/ru_market_2026-11.
# star: true — главная маска (ярус A: три частоты + регион + «Динамика»).
# broad: true — широкая маска (ярус B: базовая частота + левая колонка «Что искали со словом…»).
# Остальное — ярус C: только базовая частота; пропускать, если фраза уже встретилась в левой колонке A/B.
# medical: true — тема медицинской косметологии/лечения: тексты только после научного досье и рецензии.
# audience: consumer | pro | both. Частот здесь нет и быть не может — их снимает владелец.
version: "0.1.0"
