[project]
name = "proba-intelligence-engine"
version = "0.2.0.dev0"
description = "Proba Intelligence Engine: спрос → кластеры → контент → доказательства"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.25.1", "PyYAML==6.0.3", "rfc3339-validator==0.1.4"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
analysis = ["numpy==2.5.3", "scipy==1.18.1", "scikit-learn==1.9.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
